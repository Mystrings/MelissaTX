<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sample City Yellow Pages</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <h1>Sample City Yellow Pages</h1>
      <p class="tagline">Find local businesses, services, and contact details.</p>
      <div class="controls">
        <input id="search" placeholder="Search businesses or services..." />
        <select id="category">
          <option value="">All Categories</option>
        </select>
      </div>
    </div>
  </header>

  <main>
    <section id="results" class="results"></section>
  </main>

  <footer class="site-footer">
    <small>Sample Yellow Pages — Demo for a city directory.</small>
  </footer>

  <script src="script.js"></script>
</body>
</html>
